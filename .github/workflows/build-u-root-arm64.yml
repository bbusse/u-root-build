name: Build u-root

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [arm64]
    uses: bbusse/github-workflows/.github/workflows/build-u-root-arm64.yml@dev
    with:
      arch: ${{ matrix.arch }}
      use_arm_runner: true
      image_name: u-root
      registry: ghcr.io/bbusse
      tag: latest
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
