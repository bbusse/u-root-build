name: Build u-root

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            use_arm_runner: false
          - arch: arm64
            use_arm_runner: true
    uses: bbusse/github-workflows/.github/workflows/build-u-root.yml@dev
    with:
      arch: ${{ matrix.arch }}
      use_arm_runner: ${{ matrix.use_arm_runner }}
      image_name: u-root
      registry: ghcr.io/bbusse
      tag: latest
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
